<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One Knight in Barcaldine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Special Elite','Courier New',monospace;color:#d8cfb8;user-select:none}
  canvas{display:block}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%)}
  #dmg{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(120,0,0,0) 30%,rgba(150,0,0,.9) 100%)}
  #cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;background:#e8dcc0;border-radius:50%;pointer-events:none;box-shadow:0 0 4px #000}
  #ring{position:fixed;left:50%;top:50%;border:1px solid rgba(232,220,192,.55);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 3px #000}
  #hit{position:fixed;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%) rotate(45deg);pointer-events:none;opacity:0}
  #hit:before,#hit:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
  #hit:before{width:26px;height:2px;background:linear-gradient(90deg,currentColor 35%,transparent 35% 65%,currentColor 65%)}
  #hit:after{width:2px;height:26px;background:linear-gradient(180deg,currentColor 35%,transparent 35% 65%,currentColor 65%)}
  .hud{position:fixed;pointer-events:none;text-shadow:0 0 6px #000,0 0 2px #000;letter-spacing:1px}
  #bl{left:24px;bottom:22px}
  #br{right:28px;bottom:22px;text-align:right}
  #tc{left:50%;top:18px;transform:translateX(-50%);text-align:center}
  #tr{right:24px;top:18px;text-align:right;font-size:18px}
  .lbl{font-size:12px;opacity:.7;margin-bottom:4px}
  .bar{width:240px;height:12px;background:rgba(0,0,0,.6);border:1px solid #3a2a20}
  #hpf{height:100%;width:100%;background:linear-gradient(90deg,#4a0000,#a01010)}
  #stf{height:100%;width:100%;background:#8a8060}
  #stb{height:4px;margin-top:4px}
  #arrows{font-size:42px;color:#e8dcc0}
  #arrows small{font-size:16px;opacity:.6}
  #night{font-family:'Creepster',serif;font-size:30px;color:#a31a12;letter-spacing:3px}
  #remain{font-size:13px;opacity:.75}
  #msg{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
  #msg h1{font-family:'Creepster',serif;font-size:72px;color:#9c140c;margin:0;letter-spacing:6px;text-shadow:0 0 18px #300,0 0 4px #000}
  #msg p{margin:6px 0 0;font-size:18px;opacity:.85}
  #hint{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);font-size:15px;color:#c0392b;opacity:0;pointer-events:none;text-shadow:0 0 6px #000}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,5,5,.55),rgba(0,0,0,.92));cursor:pointer}
  #ov .box{text-align:center;max-width:620px;padding:20px}
  #ov h1{font-family:'Creepster',serif;font-size:96px;margin:0;color:#9c140c;letter-spacing:8px;text-shadow:0 0 30px #500,0 0 6px #000;line-height:1}
  #ov h2{font-weight:normal;font-size:18px;opacity:.75;margin:10px 0 28px}
  #ov h1.title{font-size:min(84px,8.5vw);letter-spacing:6px;line-height:1.05;white-space:nowrap;margin:0 -120px}
  #ov h1.title span{font-size:.5em;letter-spacing:4px;vertical-align:middle}
  #ov .ctl{display:grid;grid-template-columns:auto auto;gap:6px 22px;justify-content:center;font-size:15px;text-align:left;opacity:.85;margin-bottom:30px}
  #ov .ctl b{color:#e8dcc0;text-align:right}
  #ov .go{display:inline-block;border:1px solid #7a1a12;padding:12px 30px;font-size:20px;color:#e8dcc0;letter-spacing:3px;animation:pulse 2s infinite}
  #ov .stats{font-size:20px;margin:0 0 26px;line-height:1.6}
  #hood{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 3s;background:radial-gradient(ellipse 78% 92% at 50% 62%,rgba(0,0,0,0) 60%,rgba(48,30,16,.75) 78%,rgba(22,13,6,.97) 100%)}
  body.cowl #hood{opacity:1}
  #tl{left:24px;top:18px}
  #pieces{display:flex;gap:6px;margin-top:2px}
  #pieces i{display:block;width:18px;height:22px;border:1px solid #7a5a3a;background:rgba(0,0,0,.5);clip-path:polygon(15% 0,85% 8%,100% 45%,80% 100%,20% 92%,0 50%)}
  #pieces i.got{background:#c9a070;box-shadow:0 0 8px #c9a070}
  #hb{margin-top:10px;font-size:13px;display:none}
  #boss{position:fixed;left:50%;top:92px;transform:translateX(-50%);text-align:center;display:none;pointer-events:none;text-shadow:0 0 6px #000}
  #boss .n{font-family:'Creepster',serif;font-size:22px;letter-spacing:4px;color:#c8d0a0}
  #boss .bar{width:420px;max-width:80vw;height:10px;margin-top:4px}
  #bossf{height:100%;width:100%;background:linear-gradient(90deg,#20380e,#6a9a2a)}
  #intro{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(0,0,0,.55),rgba(0,0,0,.95));cursor:pointer;z-index:5}
  #introText{max-width:760px;padding:0 24px;text-align:center}
  #introText p{font-size:26px;line-height:1.5;margin:0 0 18px;color:#e2d6bb;opacity:0;transform:translateY(8px);transition:opacity 1.6s,transform 1.6s;text-shadow:0 0 10px #000}
  #introText p.on{opacity:1;transform:none}
  #introText p.big{font-family:'Creepster',serif;font-size:44px;color:#a31a12;letter-spacing:3px}
  #skip{position:absolute;bottom:28px;right:32px;font-size:14px;opacity:.55;letter-spacing:2px}
  @keyframes pulse{0%,100%{box-shadow:0 0 6px #500}50%{box-shadow:0 0 24px #a00}}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hood"></div>
<div id="dmg"></div>
<div id="cross"></div><div id="ring"></div><div id="hit"></div>
<div class="hud" id="bl"><div class="lbl">BLOOD</div><div class="bar"><div id="hpf"></div></div><div class="bar" id="stb"><div id="stf"></div></div></div>
<div class="hud" id="br"><div class="lbl">ARROWS</div><div id="arrows">15 <small>/ 40</small></div></div>
<div class="hud" id="tc"><div id="night"></div><div id="remain"></div></div>
<div class="hud" id="tl"><div class="lbl">THE GARMENT</div><div id="pieces"><i></i><i></i><i></i><i></i></div><div id="hb">[F] HEADBUTT</div></div>
<div id="boss"><div class="n">THE LIZARD KING</div><div class="bar"><div id="bossf"></div></div></div>
<div class="hud" id="tr">SCORE <span id="score">0</span></div>
<div id="msg"><h1 id="msgT"></h1><p id="msgS"></p></div>
<div id="hint">OUT OF ARROWS — pull them from the dead and the dirt</div>
<div id="intro"><div id="introText"></div><div id="skip">CLICK OR PRESS SPACE TO SKIP</div></div>
<div id="ov"><div class="box" id="ovbox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const V3 = THREE.Vector3;

/* ================= RENDERER / SCENE ================= */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const FOG_COL = new THREE.Color(0x070910);
const scene = new THREE.Scene();
scene.background = FOG_COL.clone();
scene.fog = new THREE.FogExp2(FOG_COL.clone(), 0.05);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.03, 400);
camera.rotation.order = 'YXZ';
scene.add(camera);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hemi = new THREE.HemisphereLight(0x3a4a70, 0x0c0906, 0.38); scene.add(hemi);
const moonLight = new THREE.DirectionalLight(0x8899cc, 0.28); moonLight.position.set(-40,60,-80); scene.add(moonLight);
const lantern = new THREE.PointLight(0xff9a45, 1.7, 17, 2); lantern.position.set(0.35,-0.35,0.1); camera.add(lantern);

/* sky: moon + stars follow the camera */
const sky = new THREE.Group(); scene.add(sky);
const moon = new THREE.Mesh(new THREE.SphereGeometry(9,24,16), new THREE.MeshBasicMaterial({color:0xd9dfef, fog:false}));
moon.position.set(-0.45,0.38,-0.8).normalize().multiplyScalar(260); sky.add(moon);
const halo = new THREE.Mesh(new THREE.SphereGeometry(14,24,16), new THREE.MeshBasicMaterial({color:0x6070a0, fog:false, transparent:true, opacity:0.12}));
halo.position.copy(moon.position); sky.add(halo);
{
  const p=[]; for(let i=0;i<800;i++){ const th=Math.random()*Math.PI*2, u=rand(0.08,1), ph=Math.acos(u), r=300;
    p.push(r*Math.sin(ph)*Math.cos(th), r*u, r*Math.sin(ph)*Math.sin(th)); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p,3));
  sky.add(new THREE.Points(g, new THREE.PointsMaterial({color:0x9aa4c0, size:1.4, sizeAttenuation:false, fog:false})));
}

/* storm clouds */
const cloudMat = (()=>{
  const c=document.createElement('canvas'); c.width=1024; c.height=256; const x=c.getContext('2d');
  x.clearRect(0,0,1024,256);
  for(let i=0;i<900;i++){
    const px=Math.random()*1024, py=Math.random()*256, r=rand(15,70), a=rand(.08,.28);
    for(const ox of [0,-1024,1024]){
      const g=x.createRadialGradient(px+ox,py,0,px+ox,py,r); g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g; x.fillRect(px+ox-r,py-r,r*2,r*2);
    }
  }
  const t=new THREE.CanvasTexture(c); t.wrapS=THREE.RepeatWrapping;
  return new THREE.MeshBasicMaterial({map:t,color:0x14161e,transparent:true,side:THREE.BackSide,fog:false,depthWrite:false});
})();
const clouds=new THREE.Mesh(new THREE.SphereGeometry(220,32,12,0,Math.PI*2,0,Math.PI*0.48),cloudMat);
clouds.renderOrder=1; sky.add(clouds);

/* lightning bolts */
const boltMat=new THREE.MeshBasicMaterial({color:0xdfe6ff,fog:false,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const boltGlowMat=new THREE.MeshBasicMaterial({color:0x5866a8,fog:false,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const bolt=new THREE.Group(); bolt.visible=false; bolt.renderOrder=2; sky.add(bolt);
function buildBolt(angle,dist){
  bolt.children.forEach(m=>m.geometry.dispose()); bolt.clear();
  const core=[], glow=[];
  const side=new V3(-Math.sin(angle),0,Math.cos(angle)); // perpendicular to view direction
  function quad(arr,a,b,w){ const o=side.clone().multiplyScalar(w);
    arr.push(a.x-o.x,a.y,a.z-o.z, a.x+o.x,a.y,a.z+o.z, b.x+o.x,b.y,b.z+o.z, a.x-o.x,a.y,a.z-o.z, b.x+o.x,b.y,b.z+o.z, b.x-o.x,b.y,b.z-o.z); }
  function branch(start,len,steps,w,depth){
    let p=start.clone();
    for(let i=0;i<steps;i++){
      const n=p.clone(); n.y-=len/steps; n.addScaledVector(side,rand(-1,1)*len/steps*0.7);
      n.x+=Math.cos(angle)*rand(-2,2); n.z+=Math.sin(angle)*rand(-2,2);
      quad(core,p,n,w); quad(glow,p,n,w*5);
      if(depth<2 && Math.random()<0.18) branch(n,len*rand(.25,.45),Math.max(3,steps/3|0),w*.5,depth+1);
      p=n; if(p.y<2) break;
    }
  }
  const top=new V3(Math.cos(angle)*dist,rand(85,100),Math.sin(angle)*dist);
  branch(top,top.y-1,26,0.45,0);
  const mk=(arr,mat)=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3)); const m=new THREE.Mesh(g,mat); m.frustumCulled=false; bolt.add(m); };
  mk(glow,boltGlowMat); mk(core,boltMat);
  return top;
}

/* rain */
const rain=(()=>{
  const n=2200, p=new Float32Array(n*6), sp=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=rand(-22,22), y=rand(0,22), z=rand(-22,22); p.set([x,y,z,x+0.04,y+0.55,z+0.02],i*6); sp[i]=rand(18,26); }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x6c7890,transparent:true,opacity:.32}));
  m.frustumCulled=false; scene.add(m); m.userData.sp=sp; return m;
})();
function updateRain(dt){
  const a=rain.geometry.attributes.position.array, sp=rain.userData.sp;
  for(let i=0;i<sp.length;i++){ const k=i*6, d=sp[i]*dt;
    a[k+1]-=d; a[k+4]-=d; a[k]-=d*0.04; a[k+3]-=d*0.04;
    if(a[k+1]<0){ const x=rand(-22,22), z=rand(-22,22), y=22+rand(0,2); a[k]=x;a[k+1]=y;a[k+2]=z;a[k+3]=x+0.04;a[k+4]=y+0.55;a[k+5]=z+0.02; } }
  rain.geometry.attributes.position.needsUpdate=true;
  rain.position.set(camera.position.x,0,camera.position.z);
}

/* eyes watching from the dark */
const watcherMat=new THREE.MeshBasicMaterial({color:0xff2a10,fog:false});
const watchers=[];
for(let i=0;i<4;i++){
  const g=new THREE.Group(); g.visible=false;
  [-0.11,0.11].forEach(x=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.035,0.02),watcherMat); m.position.x=x; g.add(m); });
  scene.add(g); watchers.push({g,t:rand(3,15),life:0,blink:0});
}

/* ================= HELPERS ================= */
const geoCache = {};
function boxGeo(w,h,d){ const k=w+','+h+','+d; return geoCache[k] || (geoCache[k]=new THREE.BoxGeometry(w,h,d)); }
function addBox(parent,w,h,d,mat,x,y,z){ const m=new THREE.Mesh(boxGeo(w,h,d),mat); m.position.set(x,y,z); parent.add(m); return m; }
function lam(c){ return new THREE.MeshLambertMaterial({color:c}); }

const colliders = [];
function addCollider(cx,cz,w,d,h){ colliders.push({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,h:h||10}); }
function insideCollider(x,z,pad=0){ for(const c of colliders) if(x>c.x0-pad&&x<c.x1+pad&&z>c.z0-pad&&z<c.z1+pad) return true; return false; }
function pushOut(pos,r){
  for(const c of colliders){
    const nx=clamp(pos.x,c.x0,c.x1), nz=clamp(pos.z,c.z0,c.z1);
    const dx=pos.x-nx, dz=pos.z-nz, d2=dx*dx+dz*dz;
    if(d2>=r*r) continue;
    if(d2>1e-8){ const d=Math.sqrt(d2); pos.x+=dx/d*(r-d); pos.z+=dz/d*(r-d); }
    else {
      const l=pos.x-c.x0, rr=c.x1-pos.x, b=pos.z-c.z0, f=c.z1-pos.z, m=Math.min(l,rr,b,f);
      if(m===l) pos.x=c.x0-r; else if(m===rr) pos.x=c.x1+r; else if(m===b) pos.z=c.z0-r; else pos.z=c.z1+r;
    }
  }
}
function prismRoof(w,h,d,mat){
  const s=new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.lineTo(-w/2,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); g.translate(0,0,-d/2);
  return new THREE.Mesh(g,mat);
}

/* ================= WORLD ================= */
const BOUND = 58.5;
{ // ground
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  x.fillStyle='#1b1d10'; x.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){ const g=Math.random();
    x.fillStyle = g<.5?`rgba(42,50,20,${rand(.2,.6)})`:g<.85?`rgba(32,22,12,${rand(.2,.6)})`:`rgba(75,72,42,${rand(.1,.35)})`;
    x.fillRect(Math.random()*256,Math.random()*256,rand(1,4),rand(1,5)); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(70,70);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300), new THREE.MeshLambertMaterial({map:t}));
  ground.rotation.x=-Math.PI/2; scene.add(ground);
  const mud=new THREE.MeshLambertMaterial({color:0x1a120b});
  [[-18,4,6],[-4,-2,4],[6,10,3],[10,-18,5],[-28,-2,4]].forEach(([mx,mz,r])=>{
    const m=new THREE.Mesh(new THREE.CircleGeometry(r,20),mud); m.rotation.x=-Math.PI/2; m.position.set(mx,0.012,mz); m.scale.y=rand(.5,1); scene.add(m); });
}

/* barn */
{
  const g=new THREE.Group(); g.position.set(-22,0,-10); scene.add(g);
  const red=lam(0x4e1712), trim=lam(0x8a8270), dark=new THREE.MeshBasicMaterial({color:0x020202});
  addBox(g,12,7,16,red,0,3.5,0);
  const roof=prismRoof(13.2,4.5,17,lam(0x1e1a18)); roof.position.y=7; g.add(roof);
  const door=addBox(g,4.4,5.2,0.1,dark,0,2.6,8.02);
  addBox(g,0.25,5.4,0.15,trim,-2.3,2.7,8.06); addBox(g,0.25,5.4,0.15,trim,2.3,2.7,8.06); addBox(g,4.8,0.25,0.15,trim,0,5.3,8.06);
  const x1=addBox(g,0.2,6.2,0.12,trim,-1.1,2.6,8.08); x1.rotation.z=0.72; x1.scale.y=0.5; x1.position.x=-1.1;
  addBox(g,2,1.6,0.1,dark,0,8.4,8.4);
  const half=addBox(g,2.2,5,0.12,red,3.4,2.5,8.6); half.rotation.y=-0.6; // ajar door
  addCollider(-22,-10,12.2,16.2,11);
}
/* farmhouse */
const windowMat = new THREE.MeshBasicMaterial({color:0xffa84a});
{
  const g=new THREE.Group(); g.position.set(14,0,-28); scene.add(g);
  const wall=lam(0x56524a), dk=new THREE.MeshBasicMaterial({color:0x050505});
  addBox(g,10,5,8,wall,0,2.5,0);
  const r=prismRoof(11,3.2,9,lam(0x241e1c)); r.position.y=5; g.add(r);
  addBox(g,1.3,1.5,0.06,windowMat,-2.8,2.9,4.02);
  addBox(g,1.3,1.5,0.06,dk,2.8,2.9,4.02);
  addBox(g,1.3,2.4,0.06,dk,0,1.2,4.02);
  addBox(g,0.8,1,0.06,windowMat,-2.8,6,4.52).scale.set(1,1,1);
  addBox(g,10,0.2,2.2,lam(0x2f2a24),0,0.1,5);
  [-4.6,4.6].forEach(px=>addBox(g,0.2,3,0.2,lam(0x6a6458),px,1.5,5.9));
  addBox(g,10,0.25,2.2,lam(0x241e1c),0,3.05,5);
  addBox(g,0.6,1.6,0.6,lam(0x2a2520),3,6.2,-1.5);
  addCollider(14,-28,10.2,8.2,8); addCollider(14,-23,10.2,2.4,3);
}
/* silo */
{
  const m=lam(0x4c5052);
  const s=new THREE.Mesh(new THREE.CylinderGeometry(3,3,13,16),m); s.position.set(-34,6.5,-24); scene.add(s);
  const d=new THREE.Mesh(new THREE.SphereGeometry(3,16,8,0,Math.PI*2,0,Math.PI/2),lam(0x3a3c3e)); d.position.set(-34,13,-24); scene.add(d);
  for(let i=0;i<5;i++) addBox(scene,6.1,0.12,6.1,lam(0x2c2e30),-34,1.5+i*2.4,-24).scale.set(1,1,1);
  addCollider(-34,-24,6,6,15);
}
/* wagon */
{
  const g=new THREE.Group(); g.position.set(-5,0,-6); g.rotation.y=0.4; scene.add(g);
  const w=lam(0x3a2a1a);
  const bed=addBox(g,3.2,0.5,1.7,w,0,0.8,0); bed.rotation.z=-0.15;
  addBox(g,3.2,0.6,0.1,w,0,1.25,0.82); addBox(g,3.2,0.6,0.1,w,0,1.25,-0.82);
  const wg=new THREE.TorusGeometry(0.55,0.07,5,14);

let actx=null, master=null, noiseBuf=null;
function initAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC(); master=actx.createGain(); master.gain.value=0.75; master.connect(actx.destination);
  const len=actx.sampleRate*2; noiseBuf=actx.createBuffer(1,len,actx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  // wind
  const n=actx.createBufferSource(); n.buffer=noiseBuf; n.loop=true;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; f.Q.value=3;
  const g=actx.createGain(); g.gain.value=0.13; n.connect(f).connect(g).connect(master); n.start();
  const l=actx.createOscillator(); l.frequency.value=0.07; const lg=actx.createGain(); lg.gain.value=240; l.connect(lg).connect(f.frequency); l.start();
  // rain
  { const r=actx.createBufferSource(); r.buffer=noiseBuf; r.loop=true; const hf=actx.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=1800;
    const rg=actx.createGain(); rg.gain.value=0.07; r.connect(hf).connect(rg).connect(master); r.start(0,0.7); }
  // drone
  [[55,0.045],[58.3,0.035],[110.7,0.015]].forEach(([fr,v])=>{ const o=actx.createOscillator(); o.frequency.value=fr; const og=actx.createGain(); og.gain.value=v; o.connect(og).connect(master); o.start(); });
}
function outNode(pan){
  if(!pan || !actx.createStereoPanner) return master;
  const p=actx.createStereoPanner(); p.pan.value=clamp(pan,-1,1); p.connect(master); return p;
}
function env(g,t,a,v,dur){ v=Math.max(v,0.0002); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,a+0.01)); }
function noise(o){
  if(!actx) return; const t=actx.currentTime+(o.delay||0), dur=o.dur||0.3;
  const s=actx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=actx.createBiquadFilter(); f.type=o.type||'lowpass'; f.frequency.setValueAtTime(o.freq||1000,t);
  if(o.freqEnd) f.frequency.exponentialRampToValueAtTime(o.freqEnd,t+dur); f.Q.value=o.q||1;
  const g=actx.createGain(); env(g,t,o.attack||0.005,o.vol||0.3,dur);
  s.connect(f).connect(g).connect(outNode(o.pan)); s.start(t,Math.random()); s.stop(t+dur+0.05);
}
function tone(o){
  if(!actx) return; const t=actx.currentTime+(o.delay||0), dur=o.dur||0.3;
  const osc=actx.createOscillator(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(o.f0,t);
  if(o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  if(o.vib){ const l=actx.createOscillator(); l.frequency.value=o.vibRate||6; const lg=actx.createGain(); lg.gain.value=o.vib; l.connect(lg).connect(osc.frequency); l.start(t); l.stop(t+dur+0.05); }
  let node=osc;
  if(o.filter){ const f=actx.createBiquadFilter(); f.type=o.filter[0]; f.frequency.value=o.filter[1]; f.Q.value=o.filter[2]||1; node.connect(f); node=f; }
  const g=actx.createGain(); env(g,t,o.attack||0.005,o.vol||0.3,dur);
  node.connect(g).connect(outNode(o.pan)); osc.start(t); osc.stop(t+dur+0.05);
}

}

const INTRO=[
  'Your birthright was stolen from you.',
  'The skin, an inheritance from your ancestors, was taken by the lizard people of the hollow earth.',
  'Reclaim what is yours and rebuild your sacred cowl.'
];
const BIG_FROM=2;
let introRun=0;
function pickVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[]; const en=vs.filter(v=>/^en/i.test(v.lang));
  const pref=[/Daniel/i,/Google UK English Male/i,/Arthur/i,/George/i,/Ryan/i,/Guy/i,/Male/i,/David/i,/Fred/i];
  for(const r of pref){ const v=en.find(v=>r.test(v.name)); if(v) return v; }
  return en[0]||vs[0]||null;
}
if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }
function startIntro(){
  state='intro'; introSeen=true; const run=++introRun;
  const box=$('introText'); box.innerHTML=INTRO.map((t,i)=>`<p class="${i>=BIG_FROM?'big':''}">${t}</p>`).join('');
  $('intro').style.display='flex'; $('ov').style.display='none';
  SFX.thunder(0.7);
  const ps=box.querySelectorAll('p'); const synth=window.speechSynthesis; const voice=synth&&pickVoice();
  function step(i){
    if(run!==introRun||state!=='intro') return;
    if(i>=INTRO.length){ setTimeout(()=>{ if(run===introRun&&state==='intro') endIntro(); },2600); return; }
    if(i===BIG_FROM){ box.querySelectorAll('p').forEach((p,k)=>{ if(k<BIG_FROM) p.style.opacity=0.25; }); SFX.gong(); }
    ps[i].classList.add('on');
    // advance once the line has been spoken AND has been on screen long enough to read
    let done=false, spoken=!synth, shown=false; const minT=Math.max(2400,INTRO[i].length*62);
    const go=()=>{ if(done) return; done=true; setTimeout(()=>step(i+1),i===BIG_FROM-1?900:500); };
    const chk=()=>{ if(spoken&&shown) go(); };
    setTimeout(()=>{ shown=true; chk(); },minT);
    setTimeout(go,INTRO[i].length*110+5000);
    if(synth){ const u=new SpeechSynthesisUtterance(INTRO[i]); if(voice) u.voice=voice; u.rate=0.8; u.pitch=0.55; u.volume=1;
      u.onend=u.onerror=()=>{ spoken=true; chk(); }; synth.speak(u); }
  }
  setTimeout(()=>step(0),900);
}
function endIntro(){
  if(state!=='intro') return;
  introRun++; if(window.speechSynthesis) speechSynthesis.cancel();
  $('intro').style.display='none'; state='ready'; showOverlay('ready');
}

const tmpA=new V3(),tmpB=new V3(),tmpC=new V3(),prev=new V3(),vH=new V3(),vB=new V3(),vL=new V3(),Z=new V3(0,0,1);

function updateArrows(dt){

    const a=flying[i]; a.life+=dt; prev.copy(a.pos);
    a.vel.y-=9.8*dt; a.pos.addScaledVector(a.vel,dt);
    const dir=a.vel.clone().normalize();
    let best=null,bestT=2,bestPart=0;
    for(const e of enemies){

      e.head.getWorldPosition(vH); vH.y+=0.1*e.s;
      let t=segSphere(prev,a.pos,vH,0.24*e.s); if(t>=0&&t<bestT){best=e;bestT=t;bestPart=1;}
      e.torso.getWorldPosition(vB); vB.y+=0.35*e.s; vB.addScaledVector(Z.clone().applyQuaternion(e.g.quaternion),0.1*e.s);
      t=segSphere(prev,a.pos,vB,0.42*e.s); if(t>=0&&t<bestT-0.01){best=e;bestT=t;bestPart=2;}
      vL.copy(e.g.position); vL.y+=0.55*e.s;

  $('hint').style.opacity=(state==='play'&&arrows===0)?(0.6+Math.sin(time*4)*0.4):0;
  const show=state==='play'||state==='pause';
  ['bl','br','tc','tr','tl','cross','ring'].forEach(id=>$(id).style.display=show?'':'none');
  bow.visible=!(state==='menu'||state==='intro'||state==='ready');
  if(!show) $('boss').style.display='none'; else if(boss&&!boss.dead) $('boss').style.display='block';
}

/* ================= LOOP ================= */
const _flashCol=new THREE.Color(0x4a5578), _cloudDark=new THREE.Color(0x14161e), _cloudLit=new THREE.Color(0xa8b0d8);
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,clock.getDelta()); time+=dt;
  if(state==='play'){
    updatePlayer(dt); updateBow(dt); updateWaves(dt); updateEnemies(dt); updateArrows(dt);
  } else if(state==='over'||state==='won'){ updateEnemies(dt); updateArrows(dt); }
  else if(state==='menu'||state==='intro'||state==='ready'){ updateShards(dt); yaw+=dt*0.04; pitch=0.05; player.pos.set(Math.sin(time*0.04)*4,0,18); }
  if(state!=='pause'){ updateCamera(dt); updateParts(dt); }
  updateAtmos(dt); if(state!=='pause') updateRain(dt); updateHUD(dt);
  renderer.render(scene,camera);
}
showOverlay('menu');
loop();
</script>
